services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clearsplit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearsplit}
      POSTGRES_DB: ${POSTGRES_DB:-clearsplit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearsplit} -d ${POSTGRES_DB:-clearsplit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      # Optional override for routing local API traffic to an external DB (for example AWS RDS):
      # API_DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/db?sslmode=require
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-clearsplit}:${POSTGRES_PASSWORD:-clearsplit}@db:5432/${POSTGRES_DB:-clearsplit}}
      ENV: local
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    # Celery auto-discovers the `celery_app` attribute in the module.
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      # Worker uses sync psycopg2 driver (NOT asyncpg).
      # get_sync_database_url() converts this, but we set the correct
      # driver here so `get_database_url()` also returns a usable URL.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-clearsplit}:${POSTGRES_PASSWORD:-clearsplit}@db:5432/${POSTGRES_DB:-clearsplit}
      ENV: local
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
