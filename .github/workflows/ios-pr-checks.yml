name: iOS PR Checks

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "ios/**"
      - ".github/workflows/ios-pr-checks.yml"
      - ".github/workflows/ios-main-checks.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ios-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_GEMFILE: ${{ github.workspace }}/ios/ClearSplit/Gemfile
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  lint:
    name: iOS Lint
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios/ClearSplit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run lint lane
        run: bundle exec fastlane ios lint

      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pr-lint-artifacts
          path: |
            ios/ClearSplit/.build/ci-results
            ios/ClearSplit/.build/logs
          if-no-files-found: ignore
          retention-days: 14

  build-and-unit:
    name: iOS Build + Unit Tests
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios/ClearSplit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build lane
        run: bundle exec fastlane ios build

      - name: Unit test lane
        run: bundle exec fastlane ios test_unit

      - name: Publish coverage summary
        if: always()
        run: |
          coverage_report="$(ls -t .build/ci-results/coverage-summary-*.txt 2>/dev/null | head -n1 || true)"
          if [[ -n "$coverage_report" ]]; then
            echo "### iOS Unit Test Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 80 "$coverage_report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build/test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pr-build-unit-artifacts
          path: |
            ios/ClearSplit/.build/ci-results
            ios/ClearSplit/.build/logs
          if-no-files-found: ignore
          retention-days: 14
