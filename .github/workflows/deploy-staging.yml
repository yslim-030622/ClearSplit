name: Deploy to ACA Staging

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional 40-char commit SHA to deploy (default: current SHA)"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-aca-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  resolve-source:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    name: Resolve Staging Source SHA
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}

    steps:
      - name: Validate manual dispatch target branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "workflow_dispatch deploy is allowed only from main (current: ${GITHUB_REF_NAME})."
            exit 1
          fi

      - name: Resolve deploy commit SHA
        id: meta
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          elif [[ -n "${INPUT_SOURCE_SHA}" ]]; then
            SOURCE_SHA="$INPUT_SOURCE_SHA"
          else
            SOURCE_SHA="${GITHUB_SHA}"
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved source SHA is invalid: $SOURCE_SHA"
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Backend CI success for SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha = '${{ steps.meta.outputs.source_sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: sourceSha,
              per_page: 100,
            });

            const successfulPushRun = runs.find(
              (run) => run.conclusion === 'success' && run.event === 'push'
            );

            if (!successfulPushRun) {
              core.setFailed(`No successful Backend CI push run found for SHA ${sourceSha}.`);
              return;
            }

            core.info(`Backend CI gate passed: ${successfulPushRun.html_url}`);

  deploy:
    name: Deploy Staging via Reusable Workflow
    needs: [resolve-source]
    uses: ./.github/workflows/deploy-aca-reusable.yml
    with:
      target_environment: staging
      deploy_mode: build
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}
      image_digest: ""
      staging_run_id: ""
      build_run_id: ${{ github.run_id }}
    secrets: inherit
