name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  MIN_COVERAGE_PR: "78"
  MIN_COVERAGE_MAIN: "80"
  ENV: test
  DATABASE_URL: postgresql+asyncpg://clearsplit:clearsplit@localhost:5432/clearsplit
  JWT_SECRET: test-secret-key-for-ci-only-not-for-production-minimum-32-chars
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 15
  REFRESH_TOKEN_EXPIRE_DAYS: 30
  S3_BUCKET_NAME: clearsplit-ci-test-bucket
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint gate (full Ruff checks)
        run: |
          ruff check app app/tests

  backend-migrations:
    name: Backend Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearsplit
          POSTGRES_PASSWORD: clearsplit
          POSTGRES_DB: clearsplit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate migrations from clean DB
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  backend-test-pr:
    name: Backend Tests (PR)
    if: github.event_name == 'pull_request'
    needs: [backend-lint, backend-migrations]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearsplit
          POSTGRES_PASSWORD: clearsplit
          POSTGRES_DB: clearsplit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run non-e2e test suite with coverage
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest -m "not e2e" \
            --junitxml=artifacts/junit.xml \
            --cov=app \
            --cov-fail-under=${MIN_COVERAGE_PR} \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=term-missing \
            --durations=20 \
            -v | tee artifacts/pytest.log

      - name: Upload PR test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pr-artifacts
          path: |
            backend/artifacts
            backend/.coverage
          retention-days: 14

  backend-test-main:
    name: Backend Tests (Main Full Suite)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-lint, backend-migrations]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearsplit
          POSTGRES_PASSWORD: clearsplit
          POSTGRES_DB: clearsplit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run full backend test suite (includes e2e)
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest \
            --junitxml=artifacts/junit.xml \
            --cov=app \
            --cov-fail-under=${MIN_COVERAGE_MAIN} \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=term-missing \
            --durations=30 \
            -v | tee artifacts/pytest.log

      - name: Upload main test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-test-artifacts
          path: |
            backend/artifacts
            backend/.coverage
          retention-days: 21

  backend-archive-main:
    name: Backend Archive Build (Main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test-main]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t clearsplit-backend:${{ github.sha }} ./backend

      - name: Export image metadata
        run: |
          mkdir -p backend-build-artifacts
          docker image inspect clearsplit-backend:${{ github.sha }} > backend-build-artifacts/image-inspect.json

      - name: Upload archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-build-artifacts
          path: backend-build-artifacts
          retention-days: 21
