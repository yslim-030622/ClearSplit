name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-*.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-*.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIN_COVERAGE_PR: "80"
  MIN_COVERAGE_MAIN: "80"
  ENV: test
  DATABASE_URL: postgresql+asyncpg://clearsplit:clearsplit@localhost:5432/clearsplit
  JWT_SECRET: test-secret-key-for-ci-only-not-for-production-minimum-32-chars
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 15
  REFRESH_TOKEN_EXPIRE_DAYS: 30
  S3_BUCKET_NAME: clearsplit-ci-test-bucket
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Print runtime context
        run: |
          python --version
          pip --version
          pytest --version

      - name: Run lint gate (full Ruff checks)
        run: |
          ruff check app app/tests

  backend-migrations:
    name: Backend Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearsplit
          POSTGRES_PASSWORD: clearsplit
          POSTGRES_DB: clearsplit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print runtime context
        run: |
          python --version
          pip --version
          alembic --version

      - name: Wait for Postgres readiness
        run: |
          python - <<'PY'
          import asyncio
          import os
          import time
          import asyncpg

          dsn = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1)
          deadline = time.time() + 60

          async def wait_for_db() -> None:
              while True:
                  try:
                      conn = await asyncpg.connect(dsn)
                      await conn.close()
                      print("Postgres is ready")
                      return
                  except Exception as exc:
                      if time.time() >= deadline:
                          raise SystemExit(f"Postgres did not become ready in time: {exc}")
                      print(f"Waiting for Postgres: {exc}")
                      await asyncio.sleep(2)

          asyncio.run(wait_for_db())
          PY

      - name: Validate forward-only migrations from clean DB
        run: |
          alembic upgrade head
          python app/scripts/migration_precheck.py

  backend-test-pr:
    name: Backend Tests (PR)
    if: github.event_name == 'pull_request'
    needs: [backend-lint, backend-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearsplit
          POSTGRES_PASSWORD: clearsplit
          POSTGRES_DB: clearsplit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Print runtime context
        run: |
          python --version
          pip --version
          pytest --version

      - name: Wait for Postgres readiness
        run: |
          python - <<'PY'
          import asyncio
          import os
          import time
          import asyncpg

          dsn = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1)
          deadline = time.time() + 60

          async def wait_for_db() -> None:
              while True:
                  try:
                      conn = await asyncpg.connect(dsn)
                      await conn.close()
                      print("Postgres is ready")
                      return
                  except Exception as exc:
                      if time.time() >= deadline:
                          raise SystemExit(f"Postgres did not become ready in time: {exc}")
                      print(f"Waiting for Postgres: {exc}")
                      await asyncio.sleep(2)

          asyncio.run(wait_for_db())
          PY

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run non-e2e test suite with coverage
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest -m "not e2e" \
            --junitxml=artifacts/junit.xml \
            --cov=app \
            --cov-fail-under="${MIN_COVERAGE_PR}" \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=term-missing \
            --durations=20 \
            -v | tee artifacts/pytest.log

      - name: Publish backend coverage summary
        if: always()
        run: |
          if [[ ! -f artifacts/coverage.xml ]]; then
            echo "### Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("artifacts/coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100
          print("### Backend Coverage")
          print("")
          print(f"- Line coverage: {line_rate:.2f}%")
          print(f"- Branch coverage: {branch_rate:.2f}%")
          PY

      - name: Upload PR test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pr-artifacts
          path: |
            backend/artifacts
            backend/.coverage
          retention-days: 14

  backend-test-main:
    name: Backend Tests (Main Full Suite)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [backend-lint, backend-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearsplit
          POSTGRES_PASSWORD: clearsplit
          POSTGRES_DB: clearsplit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Print runtime context
        run: |
          python --version
          pip --version
          pytest --version

      - name: Wait for Postgres readiness
        run: |
          python - <<'PY'
          import asyncio
          import os
          import time
          import asyncpg

          dsn = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1)
          deadline = time.time() + 60

          async def wait_for_db() -> None:
              while True:
                  try:
                      conn = await asyncpg.connect(dsn)
                      await conn.close()
                      print("Postgres is ready")
                      return
                  except Exception as exc:
                      if time.time() >= deadline:
                          raise SystemExit(f"Postgres did not become ready in time: {exc}")
                      print(f"Waiting for Postgres: {exc}")
                      await asyncio.sleep(2)

          asyncio.run(wait_for_db())
          PY

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run full backend test suite (includes e2e)
        run: |
          mkdir -p artifacts
          set -o pipefail
          pytest \
            --junitxml=artifacts/junit.xml \
            --cov=app \
            --cov-fail-under="${MIN_COVERAGE_MAIN}" \
            --cov-report=xml:artifacts/coverage.xml \
            --cov-report=term-missing \
            --durations=30 \
            -v | tee artifacts/pytest.log

      - name: Publish backend coverage summary
        if: always()
        run: |
          if [[ ! -f artifacts/coverage.xml ]]; then
            echo "### Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report not found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("artifacts/coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", 0.0)) * 100
          branch_rate = float(root.attrib.get("branch-rate", 0.0)) * 100
          print("### Backend Coverage")
          print("")
          print(f"- Line coverage: {line_rate:.2f}%")
          print(f"- Branch coverage: {branch_rate:.2f}%")
          PY

      - name: Upload main test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-test-artifacts
          path: |
            backend/artifacts
            backend/.coverage
          retention-days: 21
