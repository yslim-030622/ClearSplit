name: Deploy to ACA Production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "40-char commit SHA to promote from successful staging deploy"
        required: true
        type: string
      confirm_production:
        description: "Type YES to confirm production deployment"
        required: true
        type: string

concurrency:
  group: deploy-aca-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  validate-gates:
    name: Validate Production Promotion Gates
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.validate-input.outputs.source_sha }}
      staging_run_id: ${{ steps.check-staging.outputs.staging_run_id }}

    steps:
      - name: Validate manual inputs and branch
        id: validate-input
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Production deploy is allowed only from main (current: ${GITHUB_REF_NAME})."
            exit 1
          fi

          if [[ "$CONFIRM_PRODUCTION" != "YES" ]]; then
            echo "confirm_production must be exactly YES"
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a 40-character lowercase commit SHA"
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Backend CI success for SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha = '${{ steps.validate-input.outputs.source_sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: sourceSha,
              per_page: 100,
            });

            const successfulPushRun = runs.find(
              (run) => run.conclusion === 'success' && run.event === 'push'
            );

            if (!successfulPushRun) {
              core.setFailed(`No successful Backend CI push run found for SHA ${sourceSha}.`);
              return;
            }

            core.info(`Backend CI gate passed: ${successfulPushRun.html_url}`);

      - name: Validate staging deploy success for SHA
        id: check-staging
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha = '${{ steps.validate-input.outputs.source_sha }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'deploy-staging.yml',
              head_sha: sourceSha,
              per_page: 100,
            });

            const successfulRun = runs.find((run) => run.conclusion === 'success');

            if (!successfulRun) {
              core.setFailed(`No successful staging deployment found for SHA ${sourceSha}.`);
              return;
            }

            core.setOutput('staging_run_id', String(successfulRun.id));
            core.info(`Staging deployment gate passed: ${successfulRun.html_url}`);

  deploy:
    name: Deploy Production via Reusable Workflow
    needs: [validate-gates]
    uses: ./.github/workflows/deploy-aca-reusable.yml
    with:
      target_environment: production
      deploy_mode: promote
      source_sha: ${{ needs.validate-gates.outputs.source_sha }}
      image_digest: ""
      staging_run_id: ${{ needs.validate-gates.outputs.staging_run_id }}
      build_run_id: ""
    secrets: inherit
